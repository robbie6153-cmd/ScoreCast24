<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Football Prediction Leaderboard - ScoreCast24
  </title>

  <meta
    name="description"
    content="View the latest ScoreCast24 leaderboard and see how players are performing in this week's football prediction game."
  />

  <meta
    property="og:title"
    content="Football Prediction Leaderboard - ScoreCast24"
  />

  <meta
    property="og:description"
    content="See the latest ScoreCast24 standings, compare scores and view player predictions."
  />

  <meta
    property="og:image"
    content="https://scorecast24.com/homepage.jpg"
  />

  <meta
    property="og:url"
    content="https://scorecast24.com/leaderboard.html"
  />

  <meta
    property="og:type"
    content="website"
  />

  <link
    rel="canonical"
    href="https://scorecast24.com/leaderboard.html"
  />

  <link
    rel="stylesheet"
    href="style.css?v=25"
  />
</head>

<body>

  <div class="page">

    <header class="top-bar">
      <a
        href="index.html"
        class="menu-btn"
      >
        ⌂
      </a>
    </header>


    <main class="leaderboard-page">

      <h1>Leaderboard</h1>

      <p class="leaderboard-hint">
        Tap a player to view their predictions.
      </p>


      <div class="round-tabs">

        <button
          id="weekLeaderboardTab"
          class="round-tab active"
          type="button"
        >
          Week One Leaderboard
        </button>

        <button
          id="seasonLeaderboardTab"
          class="round-tab"
          type="button"
        >
          Season Leaderboard
        </button>

      </div>


      <div id="leaderboardContainer">
        Loading leaderboard...
      </div>


      <a
        href="index.html"
        class="secondary-btn"
      >
        Back to Home
      </a>

    </main>

  </div>


  <script
    type="module"
    src="leaderboard.js?v=6"
  ></script>

</html>
