<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Player Database | ScoreCast24 Dream Team</title>

  <meta
    name="description"
    content="View the ScoreCast24 Dream Team player database."
  >

  <link
    rel="stylesheet"
    href="dream.css?v=5"
  >

</head>

<body>

  <main class="dream-game-page">

    <section class="dream-game-header">

      <a
        href="dream.html"
        class="back-home-link"
      >
        ← Dream Team Home
      </a>

      <h1>Player Database</h1>

      <p>
        View all players currently available in the
        ScoreCast24 Dream Team.
      </p>

    </section>


    <section
      class="player-database-filters"
      aria-label="Player database filters"
    >

      <div class="player-database-filter">

        <label for="databasePlayerSearch">
          Search player
        </label>

        <input
          type="search"
          id="databasePlayerSearch"
          placeholder="Search player..."
          autocomplete="off"
        >

      </div>


      <div class="player-database-filter">

        <label for="databasePositionFilter">
          Position
        </label>

        <select id="databasePositionFilter">

          <option value="ALL">
            All positions
          </option>

          <option value="Goalkeeper">
            Goalkeepers
          </option>

          <option value="Defender">
            Defenders
          </option>

          <option value="Midfielder">
            Midfielders
          </option>

          <option value="Attacker">
            Attackers
          </option>

        </select>

      </div>


      <div class="player-database-filter">

        <label for="databaseClubFilter">
          Club
        </label>

        <select id="databaseClubFilter">

          <option value="ALL">
            All clubs
          </option>

        </select>

      </div>


      <button
        type="button"
        id="clearDatabaseFilters"
        class="database-clear-filters"
      >
        Clear filters
      </button>

    </section>


    <section class="player-database">

      <section
        class="player-database-position-section"
        data-position="Goalkeeper"
      >

        <h2
          class="database-position goalkeeper-heading"
        >
          Goalkeepers
        </h2>

        <div id="goalkeepers">
          Loading...
        </div>

      </section>


      <section
        class="player-database-position-section"
        data-position="Defender"
      >

        <h2
          class="database-position defender-heading"
        >
          Defenders
        </h2>

        <div id="defenders">
          Loading...
        </div>

      </section>


      <section
        class="player-database-position-section"
        data-position="Midfielder"
      >

        <h2
          class="database-position midfielder-heading"
        >
          Midfielders
        </h2>

        <div id="midfielders">
          Loading...
        </div>

      </section>


      <section
        class="player-database-position-section"
        data-position="Attacker"
      >

        <h2
          class="database-position attacker-heading"
        >
          Attackers
        </h2>

        <div id="attackers">
          Loading...
        </div>

      </section>

    </section>

  </main>


  <script
    type="module"
    src="dream-player-database.js?v=5"
  ></script>

</body>

</html>
