<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Build Your Weekly Dream Team | ScoreCast24</title>

  <meta
    name="description"
    content="Build and submit your weekly ScoreCast24 Dream Team."
  >

  <link
    rel="stylesheet"
    href="dream.css?v=3"
  >

</head>

<body>

  <main class="dream-game-page">

    <section class="dream-game-header">

      <a
        href="dream.html"
        class="back-home-link"
      >
        ← Dream Team Home
      </a>

      <img
        src="icon-512.png"
        alt="ScoreCast24"
        class="dream-game-logo"
      >

      <h1>
        Build Your Weekly Dream Team
      </h1>

      <p id="dreamLoginStatus">
        Checking your ScoreCast24 account...
      </p>

<div
  id="dreamDeadlineCountdown"
  class="dream-deadline-countdown"
>
  Loading submission deadline...
</div>

<a
  href="#"
  id="viewMyTeamBtn"
  class="dream-yellow-button"
>
  View My Team
</a>

</section>


    <section class="dream-controls">

      <label for="formationSelect">
        Formation
      </label>

      <select id="formationSelect">

        <option value="">
          Choose formation
        </option>

        <option value="4-4-2">4-4-2</option>
        <option value="4-3-3">4-3-3</option>
        <option value="4-5-1">4-5-1</option>
        <option value="5-3-2">5-3-2</option>
        <option value="5-4-1">5-4-1</option>
        <option value="3-4-3">3-4-3</option>
        <option value="3-5-2">3-5-2</option>

      </select>


      <label for="clubFilter">
        Club
      </label>

      <select id="clubFilter">

        <option value="ALL">
          All clubs
        </option>

      </select>


      <label for="positionFilter">
        Position
      </label>

      <select id="positionFilter">

        <option value="ALL">
          All positions
        </option>

        <option value="Goalkeeper">
          Goalkeepers
        </option>

        <option value="Defender">
          Defenders
        </option>

        <option value="Midfielder">
          Midfielders
        </option>

        <option value="Attacker">
          Attackers
        </option>

      </select>


      <label for="playerSearch">
        Search
      </label>

      <input
        id="playerSearch"
        type="search"
        placeholder="Search player name"
      >


      <label for="ratingFilter">
        Rating
      </label>

      <select id="ratingFilter">

        <option value="ALL">
          All ratings
        </option>

        <option value="60-69">
          60–69
        </option>

        <option value="70-79">
          70–79
        </option>

        <option value="80-89">
          80–89
        </option>

        <option value="90+">
          90+
        </option>

      </select>

    </section>


    <section class="dream-summary">

      <div>
        Players:
        <strong id="selectedCount">
          0/11
        </strong>
      </div>

      <div>
        Rating:
        <strong id="ratingTotal">
          0/888
        </strong>
      </div>

      <div>
        Formation:
        <strong id="formationStatus">
          Not selected
        </strong>
      </div>

    </section>


    <p
      id="dreamMessage"
      class="dream-message"
    ></p>



    <section class="dream-submit-section">

      <button
        id="submitDreamTeamBtn"
        class="dream-yellow-button"
        type="button"
        disabled
      >
        Submit Dream Team
      </button>

      <a
        href="dream-leaderboard.html"
        class="dream-yellow-button"
      >
        View Leaderboard
      </a>

      <a
        href="dream-mini-leagues.html"
        class="dream-yellow-button"
      >
        Mini Leagues
      </a>

      <a
        href="rules.html"
        class="dream-yellow-button"
      >
        Rules
      </a>

    </section>


    <section class="available-players-section">

      <h2>
        Available Players
      </h2>

      <div
        id="playerList"
        class="player-list"
      >
        <p>
          Loading players...
        </p>
      </div>

    </section>

  </main>


 <script
  type="module"
  src="football-api.js?v=1"
></script>

<script
  type="module"
  src="dream.js?v=119"
></script>

</body>

</html>
