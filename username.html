<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Username - ScoreCast24</title>
  <meta name="description" content="Create your permanent ScoreCast24 username to appear on leaderboards and across all ScoreCast24 football prediction games.">

<meta property="og:title" content="Create Username - ScoreCast24">
<meta property="og:description" content="Create your ScoreCast24 username and get ready to compete in weekly football prediction games.">
<meta property="og:image" content="https://scorecast24.com/homepage.jpg">
<meta property="og:url" content="https://scorecast24.com/username.html">
<meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css?v=22">
</head>

<body>
  <div class="page">

    <header class="top-bar">
      <div class="logo-text">ScoreCast24</div>
      <a href="index.html" class="menu-btn">Home</a>
    </header>

    <main class="home-page">
      <div class="home-news-box">
        <h2>🎉 email verified</h2>
        <p>
          Choose your permanent ScoreCast24 username.
          This will appear on leaderboards and can be used across all ScoreCast24 games.
        </p>

        <input
          id="usernameInput"
          type="text"
          placeholder="Choose username"
          style="width:100%;max-width:360px;padding:12px;border-radius:10px;border:1px solid #555;font-size:16px;"
        >

        <button id="saveUsernameBtn" class="start-btn">
          Complete Account
        </button>

        <p id="usernameMessage"></p>
      </div>
    </main>

  </div>

  <script type="module">
    import { auth, db } from "./firebase.js?v=99";

 import {
  onAuthStateChanged,
  browserLocalPersistence,
  setPersistence
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

import {
  doc,
  getDoc,
  getDocs,
  collection,
  query,
  where,
  setDoc,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const usernameInput = document.getElementById("usernameInput");
    const saveUsernameBtn = document.getElementById("saveUsernameBtn");
    const usernameMessage = document.getElementById("usernameMessage");

    let currentUser = null;
    await setPersistence(auth, browserLocalPersistence);

    function cleanUsername(name) {
      return name.trim().toLowerCase().replace(/\s+/g, "-");
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        usernameMessage.textContent =
          "You need to be logged in first. Please return to the homepage and log in.";
        saveUsernameBtn.disabled = true;
        return;
      }

      await user.reload();

      currentUser = auth.currentUser;

      if (!currentUser.emailVerified) {
        usernameMessage.textContent =
          "Please verify your email first, then refresh this page.";
        saveUsernameBtn.disabled = true;
        return;
      }

  const userRef = doc(
  db,
  "users",
  currentUser.uid
);

const userSnap =
  await getDoc(userRef);


/*
  Existing users should never be
  allowed to create another username.
*/

if (userSnap.exists()) {

  const existingUsername =
    userSnap.data().username || "";

  const existingCleanUsername =
    userSnap.data().cleanUsername || "";

  if (existingUsername) {

    localStorage.setItem(
      "scorecast24Username",
      existingUsername
    );

    if (existingCleanUsername) {
      localStorage.setItem(
        "scorecast24CleanUsername",
        existingCleanUsername
      );
    }

    usernameMessage.textContent =
      `You already have the username ${existingUsername}. Redirecting...`;

    saveUsernameBtn.disabled = true;

    setTimeout(() => {
      window.location.href =
        "index.html";
    }, 1200);

    return;
  }
}
/*
  Recovery check:

  If users/{uid} is missing, check whether
  this UID already owns a username in the
  usernames collection.
*/

const existingUsernameQuery =
  query(
    collection(
      db,
      "usernames"
    ),
    where(
      "uid",
      "==",
      currentUser.uid
    )
  );

const existingUsernameSnap =
  await getDocs(
    existingUsernameQuery
  );


if (!existingUsernameSnap.empty) {

  const existingUsernameDoc =
    existingUsernameSnap.docs[0];

  const existingUsernameData =
    existingUsernameDoc.data();

  const recoveredUsername =
    existingUsernameData.username || "";

  const recoveredCleanUsername =
    existingUsernameDoc.id;


  if (recoveredUsername) {

    /*
      Rebuild the missing users/{uid}
      document from the existing
      usernames record.
    */

    await setDoc(
      userRef,
      {
        uid:
          currentUser.uid,

        email:
          currentUser.email,

        username:
          recoveredUsername,

        cleanUsername:
          recoveredCleanUsername,

        recoveredAt:
          serverTimestamp()
      },
      {
        merge: true
      }
    );


    localStorage.setItem(
      "scorecast24Username",
      recoveredUsername
    );

    localStorage.setItem(
      "scorecast24CleanUsername",
      recoveredCleanUsername
    );


    usernameMessage.textContent =
      `Your username ${recoveredUsername} has been restored. Redirecting...`;

    saveUsernameBtn.disabled =
      true;


    setTimeout(() => {

      window.location.href =
        "index.html";

    }, 1200);


    return;
  }
}

usernameMessage.textContent =
  "Email verified. Choose your username.";
    });

    saveUsernameBtn.addEventListener("click", async () => {
      if (!currentUser) {
        usernameMessage.textContent = "You need to be logged in first.";
        return;
      }

      const username = usernameInput.value.trim();
      const cleanName = cleanUsername(username);

      if (username.length < 3) {
        usernameMessage.textContent = "Username must be at least 3 characters.";
        return;
      }

      if (!/^[a-zA-Z0-9 _-]+$/.test(username)) {
        usernameMessage.textContent =
          "Use letters, numbers, spaces, hyphens or underscores only.";
        return;
      }

      try {
        const usernameRef = doc(db, "usernames", cleanName);
        const usernameSnap = await getDoc(usernameRef);

        if (usernameSnap.exists()) {
          usernameMessage.textContent = "That username is already taken.";
          return;
        }

    const batch =
  writeBatch(db);

batch.set(
  doc(
    db,
    "users",
    currentUser.uid
  ),
  {
    uid:
      currentUser.uid,

    email:
      currentUser.email,

    username:
      username,

    cleanUsername:
      cleanName,

    createdAt:
      serverTimestamp()
  }
);

batch.set(
  usernameRef,
  {
    uid:
      currentUser.uid,

    username:
      username,

    createdAt:
      serverTimestamp()
  }
);

await batch.commit();

        localStorage.setItem("scorecast24Username", username);
localStorage.setItem("scorecast24CleanUsername", cleanName);

        usernameMessage.textContent = "Username saved. Redirecting...";

        setTimeout(() => {
        window.location.href = "index.html?v=99";
        }, 1200);

      } catch (error) {
        console.error("Username save failed:", error);
        usernameMessage.textContent =
          "Could not save username. Please try again.";
      }
    });
  </script>
</body>
</html>
